<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Muted Realistic Palette: Iron, Steel, Bronze, Dark Steppe -->
    <linearGradient id="steppeNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="50%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Pixel Dither Pattern -->
    <pattern id="pixelGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#141923" />
      <rect width="4" height="4" fill="#1a202c" />
      <rect x="4" y="4" width="4" height="4" fill="#121620" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="8" fill="url(#steppeNight)" />
  <rect width="800" height="240" rx="8" fill="url(#pixelGrid)" opacity="0.4" />

  <!-- Muted Pixel Border -->
  <rect x="4" y="4" width="792" height="232" rx="6" fill="none" stroke="#2d3748" stroke-width="4" stroke-dasharray="8 4" />
  <rect x="12" y="12" width="776" height="216" rx="4" fill="none" stroke="#1a202c" stroke-width="2" />

  <!-- Steppe Horizon & Distant Pixel Mountains (Left & Right) -->
  <g fill="#1a2332" opacity="0.7">
    <!-- Left Mountains -->
    <rect x="40" y="160" width="16" height="40" />
    <rect x="56" y="144" width="24" height="56" />
    <rect x="80" y="128" width="32" height="72" />
    <rect x="112" y="152" width="24" height="48" />
    <rect x="136" y="168" width="40" height="32" />

    <!-- Right Mountains -->
    <rect x="620" y="168" width="32" height="32" />
    <rect x="652" y="144" width="24" height="56" />
    <rect x="676" y="120" width="32" height="80" />
    <rect x="708" y="152" width="24" height="48" />
    <rect x="732" y="160" width="32" height="40" />
  </g>

  <!-- Pixelated Turkic Star Tamga Motifs (Side Accents) -->
  <g fill="#718096" opacity="0.4">
    <!-- Left Tamga Star -->
    <rect x="100" y="50" width="8" height="24" />
    <rect x="92" y="58" width="24" height="8" />
    <rect x="96" y="54" width="16" height="16" />

    <!-- Right Tamga Star -->
    <rect x="690" y="50" width="8" height="24" />
    <rect x="682" y="58" width="24" height="8" />
    <rect x="686" y="54" width="16" height="16" />
  </g>

  <!-- CENTER PIXEL ART KIPCHAK IRON MASK & HELMET -->
  <!-- Main Position: Center (400, 120) -->
  <g transform="translate(400, 120)">
    <!-- Helmet Point Top -->
    <rect x="-4" y="-76" width="8" height="16" fill="#a0aec0" />
    <rect x="-8" y="-60" width="16" height="12" fill="#718096" />
    
    <!-- Helmet Dome -->
    <rect x="-24" y="-48" width="48" height="12" fill="#4a5568" />
    <rect x="-36" y="-36" width="72" height="12" fill="#2d3748" />
    <rect x="-44" y="-24" width="88" height="16" fill="#4a5568" />

    <!-- Highlight on Helmet Left Side -->
    <rect x="-20" y="-44" width="8" height="8" fill="#cbd5e0" />
    <rect x="-32" y="-32" width="12" height="8" fill="#a0aec0" />
    <rect x="-40" y="-20" width="16" height="8" fill="#718096" />

    <!-- Visor Eyebrow Ridge (Iron Rim) -->
    <rect x="-48" y="-8" width="96" height="8" fill="#718096" />
    <rect x="-44" y="-8" width="88" height="4" fill="#a0aec0" />

    <!-- Visor Face Plate Base (Anthropomorphic Visor) -->
    <rect x="-40" y="0" width="80" height="64" fill="#2d3748" />
    <rect x="-36" y="64" width="72" height="16" fill="#1a202c" />

    <!-- Left Eye Slot (Almond Shaped Pixel Cutout) -->
    <rect x="-28" y="8" width="16" height="8" fill="#0c0e12" />
    <rect x="-24" y="6" width="8" height="2" fill="#718096" />

    <!-- Right Eye Slot (Almond Shaped Pixel Cutout) -->
    <rect x="12" y="8" width="16" height="8" fill="#0c0e12" />
    <rect x="16" y="6" width="8" height="2" fill="#718096" />

    <!-- Prominent Nose Ridge (Wrought Iron Nose) -->
    <rect x="-4" y="0" width="8" height="32" fill="#718096" />
    <rect x="-6" y="24" width="12" height="8" fill="#a0aec0" />

    <!-- Engraved Kipchak Moustache (Iron Facial Feature) -->
    <rect x="-32" y="36" width="64" height="6" fill="#1a202c" />
    <rect x="-24" y="34" width="48" height="4" fill="#4a5568" />
    <rect x="-16" y="32" width="32" height="4" fill="#718096" />
    <rect x="-36" y="42" width="16" height="6" fill="#2d3748" />
    <rect x="20" y="42" width="16" height="6" fill="#2d3748" />

    <!-- Mouth Slot -->
    <rect x="-12" y="48" width="24" height="4" fill="#0c0e12" />

    <!-- Chin & Neck Armor -->
    <rect x="-24" y="76" width="48" height="8" fill="#2d3748" />
    <rect x="-16" y="84" width="32" height="6" fill="#1a202c" />

    <!-- Rivets -->
    <rect x="-36" y="-4" width="4" height="4" fill="#e2e8f0" />
    <rect x="32" y="-4" width="4" height="4" fill="#e2e8f0" />
    <rect x="-32" y="20" width="4" height="4" fill="#cbd5e0" />
    <rect x="28" y="20" width="4" height="4" fill="#cbd5e0" />
  </g>
</svg>
